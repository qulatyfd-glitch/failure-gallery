<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 · 非标准答案</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo"><a href="{{ url_for('index') }}">非标准答案</a></h1>
      <p class="tagline">管理员登录</p>
      <nav class="main-nav">
        <a href="{{ url_for('index') }}" class="back-btn">← 返回</a>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <div class="empty-state">
      <h2>管理员登录</h2>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-box">
            {% for m in messages %}<p>{{ m }}</p>{% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      <form method="POST" class="upload-form">
        <div class="form-group">
          <label for="password">管理员密码</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">登录后台</button>
      </form>
    </div>
  </main>
</body>
</html>
