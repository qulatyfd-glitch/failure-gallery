<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 非标准答案</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo"><a href="{{ url_for('index') }}">非标准答案</a></h1>
      <p class="tagline">回来看看你的「失败」又长出了什么。</p>
      <nav class="main-nav">
        <a href="{{ url_for('index') }}" class="back-btn">← 返回</a>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-box">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="upload-form">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg">登录</button>
      <p class="form-foot">还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>非标准答案 · 献给所有没有被标准定义的可能</p>
    </div>
  </footer>
</body>
</html>
