<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="0.5" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#fbe9c8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="url(#sky)"/>

  <!-- 一轮不完美的太阳（缺一角，象征"偏离标准"） -->
  <circle cx="1000" cy="70" r="48" fill="#f0c25c"/>
  <rect x="978" y="38" width="46" height="46" fill="#fff3d6" transform="rotate(-30 1000 70)"/>

  <!-- 山丘，像纸张折痕 -->
  <path d="M0 220 L0 170 Q150 130 300 170 Q450 210 600 165 Q750 120 900 170 Q1050 210 1200 160 L1200 220 Z" fill="#e8d9a0" opacity="0.7"/>

  <!-- 从"断线"里长出的藤蔓与芽：失败中生长 -->
  <g stroke="#c98a3f" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M120 190 Q140 140 190 130 Q240 120 260 80"/>
    <path d="M260 80 Q280 60 300 62"/>
    <path d="M240 120 Q220 100 225 85"/>
  </g>
  <g fill="#e8b04a">
    <ellipse cx="262" cy="74" rx="12" ry="16" transform="rotate(-30 262 74)"/>
    <ellipse cx="228" cy="80" rx="10" ry="14" transform="rotate(20 228 80)"/>
    <ellipse cx="300" cy="58" rx="9" ry="12" transform="rotate(10 300 58)"/>
  </g>

  <!-- 一些悬着的"未完成的点" -->
  <g fill="#d9a441">
    <circle cx="480" cy="120" r="6"/>
    <circle cx="520" cy="100" r="4"/>
    <circle cx="560" cy="130" r="5"/>
  </g>

  <!-- 一行小字 -->
  <text x="600" y="205" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif"
        font-size="20" fill="#b5863a" opacity="0.85" letter-spacing="6">非标准答案 · 献给所有没有被标准定义的可能</text>
</svg>
